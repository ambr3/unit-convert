<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bg="grid">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Convert units on this device. Nothing is sent anywhere.">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seclusa Convert">
  <meta name="version" content="0.1.7">

  <!--
    Permissions-Policy in a <meta> tag is inert. Browsers only honour it as a
    response header. It is here so the intent is visible next to the page that
    needs it.
  -->
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()">

  <!--
    CSP meta. `connect-src 'none'` is the important one: the app cannot make a
    network request even if it wanted to. There is no server, no API key and no
    analytics. `frame-ancestors` is deliberately absent: browsers ignore it
    inside <meta>.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; child-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'">

  <title>Seclusa Convert</title>

  <script src="static/js/theme-boot.js"></script>
  <link rel="stylesheet" href="static/css/seclusa-base.css">
  <link rel="stylesheet" href="static/css/app.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="static/icons/icon-192.png">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand"><span class="brand-mark">Seclusa</span> Convert</h1>
    <button type="button" class="theme-btn" id="btn-theme" aria-haspopup="dialog" aria-controls="sheet-theme">Theme</button>
  </div>
</header>

<main class="wrap">
  <p class="cat-label" id="category-label">Category</p>
  <div class="cat-row" id="category-row" role="tablist" aria-labelledby="category-label"></div>

  <section class="converter" aria-label="Unit converter">
    <div class="from-stack">
      <div class="from-block">
        <span class="field-label from-label">From</span>
        <select id="from-unit" aria-label="From unit"></select>
      </div>
      <div class="value-block">
        <span class="field-label value-label">Value</span>
        <input type="text" id="from-value" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="64" aria-label="Value to convert">
        <span class="value-unit" id="value-unit"></span>
      </div>
    </div>

    <button type="button" class="btn-swap" id="btn-swap" aria-label="Swap units" title="Swap units">⇄</button>

    <div class="to-block">
      <span class="field-label">To</span>
      <select id="to-unit" aria-label="To unit"></select>
      <span class="to-unit-sub" id="to-unit-label"></span>
    </div>

    <div class="result" aria-live="polite">
      <div class="result-head">
        <span class="result-label">Result</span>
        <span class="result-hint" id="result-hint"></span>
      </div>
      <div class="result-value" id="result-value">—</div>
      <button type="button" class="btn-copy" id="btn-copy">Copy result</button>
    </div>
  </section>

  <footer class="footer">
    <p>
      <a href="LICENSE">GPL-3.0</a>
      · Made with <span class="heart" role="img" aria-label="love">❤️</span>
      <span class="flag" role="img" aria-label="United Kingdom">🇬🇧</span>
    </p>
  </footer>
</main>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet-theme" role="dialog" aria-modal="false" aria-label="Theme" aria-hidden="true" inert>
  <div class="sheet-handle" aria-hidden="true"></div>
  <h3>Theme</h3>
  <p class="note">Layout</p>
  <div class="theme-mode-row" role="radiogroup" aria-label="Layout">
    <button type="button" class="theme-chip" data-theme-opt="dark" role="radio" aria-checked="false">Instrument</button>
    <button type="button" class="theme-chip" data-theme-opt="light" role="radio" aria-checked="false">Dual</button>
  </div>
  <p class="note">Instrument is the dark readout panel. Dual is the stacked From / To cards.</p>
  <p class="note">On this device</p>
  <div class="theme-mode-row">
    <button type="button" class="btn" id="btn-clear">Clear saved data</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="static/js/store.js"></script>
<script src="static/js/theme.js"></script>
<script src="static/js/convert.js"></script>
<script src="static/js/app.js"></script>
</body>
</html>
